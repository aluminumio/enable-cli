name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: enbl-linux-amd64
          - os: macos-15
            artifact: enbl-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: aluminumio/install-crystal@master
      # install-crystal points PKG_CONFIG_PATH at the first Cellar/openssl* it finds, which on
      # macos-15 is openssl@1.1. Homebrew removed openssl@1.1, so a binary linked to it does not
      # start. Link openssl@3, the one the formula depends on.
      - if: runner.os == 'macOS'
        run: echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> "$GITHUB_ENV"
      - run: crystal tool format --check
      - run: crystal spec
      - run: mkdir -p bin && crystal build src/enable.cr -o bin/${{ matrix.artifact }} --release --no-debug
      - if: runner.os == 'macOS'
        run: |
          otool -L bin/${{ matrix.artifact }}
          if otool -L bin/${{ matrix.artifact }} | grep -q 'openssl@1'; then
            echo "::error::bin/${{ matrix.artifact }} links openssl@1.1, which Homebrew no longer has"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: bin/${{ matrix.artifact }}

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Read version
        id: version
        run: echo "version=$(grep '^version:' shard.yml | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Check version is not already released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" &>/dev/null; then
            echo "::error::Release v${{ steps.version.outputs.version }} already exists. Bump the version in shard.yml before merging."
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.version.outputs.version }}" artifacts/* --generate-notes

      - name: Notify Homebrew tap
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.REPO_DISPATCH_TOKEN }}
          repository: aluminumio/homebrew-tap
          event-type: enable-cli-released
          client-payload: '{"version": "${{ steps.version.outputs.version }}"}'
